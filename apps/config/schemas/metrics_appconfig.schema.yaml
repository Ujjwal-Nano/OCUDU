schema_version: 1

name: metrics_appconfig
namespace: ocudu::app_services
description: Metrics service application configuration

outputs:
  header:       apps/services/metrics/metrics_appconfig.h
  cli11_source: apps/services/metrics/metrics_config_cli11_schema.cpp
  cli11_header: apps/services/metrics/metrics_config_cli11_schema.h

parameters:
  - name: app_usage_report_period
    description: Application usage report period in milliseconds
    type: unsigned
    default: "1000"
    cli11:
      capture: true

  - name: autostart_stdout_metrics
    description: Autostart stdout metrics reporting
    type: bool
    mode: doc-only
    default: "false"

subcommands:
  - name: metrics
    description: Metrics configuration
    configurable: true
    parameters: [autostart_stdout_metrics]
    subcommands:
      - name: periodicity
        description: Metrics periodicity configuration
        configurable: true
        parameters: [app_usage_report_period]

cli11:
  function: configure_cli11_with_metrics_appconfig_schema
