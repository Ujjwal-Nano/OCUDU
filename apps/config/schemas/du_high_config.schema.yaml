# ---------------------------------------------------------------------------
# Subcommand hierarchy
# ---------------------------------------------------------------------------
subcommands:
  - name: log
    description: Logging configuration
    configurable: true
    member: config.loggers
    parameters: [mac_level, rlc_level, f1ap_level, f1u_level, gtpu_level, ntn_level, du_level,
                 hex_max_size, broadcast_enabled, f1ap_json_enabled, high_latency_diagnostics_enabled]

  - name: trace
    description: General tracer configuration
    configurable: true
    member: config.tracer
    subcommands:
      - name: layers
        description: Layer basis tracing configuration
        configurable: true
        parameters: [executor_tracing_enable]

  - name: metrics
    description: Metrics configuration
    configurable: true
    member: config.metrics
    subcommands:
      - name: periodicity
        description: Metrics periodicity configuration
        configurable: true
        parameters: [du_report_period]
      - name: layers
        description: Layer basis metrics configuration
        configurable: true
        member: layers_cfg
        parameters: [enable_scheduler, enable_rlc, enable_mac, enable_du_proc]

  - name: pcap
    description: PCAP configuration
    configurable: true
    member: config.pcaps
    parameters: [f1ap_filename, f1ap_enable, f1u_filename, f1u_enable,
                 rlc_filename, rlc_rb_type, rlc_enable,
                 mac_filename, mac_type, mac_enable]

  - name: du
    description: DU parameters
    configurable: true
    parameters: [warn_on_drop]

  - name: expert_execution
    description: Expert execution configuration
    configurable: true
    member: config.expert_execution_cfg
    subcommands:
      - name: queues
        description: Task executor queue parameters
        configurable: true
        member: du_queue_cfg
        parameters: [ue_data_executor_queue_size]

  - name: test_mode
    description: Test mode configuration
    configurable: true
    member: config.test_mode_cfg
    subcommands:
      - name: test_ue
        description: automatically created UE for testing purposes
        member: test_ue
        parameters: [rnti, nof_ues, ue_creation_stagger_slots, auto_ack_indication_delay,
                     attach_detach_duration_ms, attach_detach_guard_duration_ms,
                     pdsch_active, pusch_active, cqi, ri, pmi, i_1_1, i_1_3, i_2]

  - name: cell_cfg
    description: Default cell configuration
    configurable: true
    parameters: [cell_pci, cell_sector_id, cell_dl_arfcn, cell_band, cell_common_scs,
                 cell_channel_bandwidth_MHz, cell_nof_antennas_ul, cell_nof_antennas_dl,
                 cell_plmn, cell_additional_plmns, cell_tac, cell_enabled, cell_cell_barred,
                 cell_intra_freq_reselection, cell_q_rx_lev_min, cell_q_qual_min,
                 cell_pcg_p_nr_fr1, cell_slicing]
    subcommands:
      - name: mac_cell_group
        description: MAC Cell Group parameters
        configurable: true
        subcommands:
          - name: bsr_cfg
            description: Buffer status report configuration parameters
            parameters: [bsr_periodic_bsr_timer, bsr_retx_bsr_timer, bsr_lc_sr_delay_timer]
          - name: phr_cfg
            description: Power Headroom report configuration parameters
            parameters: [phr_prohib_timer]
          - name: sr_cfg
            description: Scheduling Request configuration parameters
            parameters: [sr_trans_max, sr_prohibit_timer]

      - name: ssb
        description: SSB parameters
        parameters: [ssb_period_msec, ssb_block_power, ssb_pss_to_sss_epre]

      - name: sib
        description: SIB configuration parameters
        parameters: [sib_si_window_len, sib_si_sched_info,
                     sib_t300, sib_t301, sib_t310, sib_n310, sib_t311, sib_n311, sib_t319]
        subcommands:
          - name: sib2
            description: SIB2 parameters
            configurable: true
            parameters: [sib2_q_hyst, sib2_thresh_serving_low_p, sib2_cell_reselection_priority,
                         sib2_q_rx_lev_min, sib2_s_intra_search_p, sib2_t_reselection_nr]
          - name: sib3
            description: SIB3 parameters
            configurable: true
            parameters: [sib3_intra_freq_neigh_cell_list, sib3_intra_freq_excluded_cell_list]
          - name: sib4
            description: SIB4 parameters
            configurable: true
            parameters: [sib4_inter_freq_carrier_freq_list]
          - name: sib5
            description: SIB5 parameters
            configurable: true
            parameters: [sib5_t_reselection_eutra, sib5_carrier_freq_list_eutra]
          - name: sib16
            description: SIB16 parameters
            configurable: true
            parameters: [sib16_freq_prio_list_slicing]
          - name: etws
            description: ETWS configuration parameters
            configurable: true
            parameters: [etws_message_id, etws_serial_num, etws_warning_type,
                         etws_data_coding_scheme, etws_warning_message]
          - name: cmas
            description: CMAS configuration parameters
            configurable: true
            parameters: [cmas_message_id, cmas_serial_num, cmas_data_coding_scheme, cmas_warning_message]

      - name: ul_common
        description: UL common parameters
        parameters: [ul_p_max, ul_max_pucchs_per_slot, ul_max_ul_grants_per_slot,
                     ul_min_pucch_pusch_prb_distance]

      - name: pdcch
        description: PDCCH parameters
        subcommands:
          - name: common
            description: PDCCH Common configuration parameters
            parameters: [pdcch_common_coreset0_index, pdcch_common_ss1_n_candidates,
                         pdcch_common_ss0_index, pdcch_common_max_coreset0_duration]
          - name: dedicated
            description: PDCCH Dedicated configuration parameters
            parameters: [pdcch_ded_coreset1_rb_start, pdcch_ded_coreset1_l_crb,
                         pdcch_ded_coreset1_duration, pdcch_ded_ss2_n_candidates,
                         pdcch_ded_dci_format_0_1_and_1_1, pdcch_ded_ss2_type, pdcch_ded_al_cqi_offset]

      - name: pdsch
        description: PDSCH parameters
        parameters: [pdsch_min_ue_mcs, pdsch_max_ue_mcs, pdsch_fixed_rar_mcs, pdsch_fixed_sib1_mcs,
                     pdsch_harq_feedback_disabled, pdsch_nof_harqs, pdsch_max_nof_harq_retxs,
                     pdsch_harq_retx_timeout, pdsch_max_consecutive_kos, pdsch_rv_sequence,
                     pdsch_mcs_table, pdsch_min_rb_size, pdsch_max_rb_size, pdsch_start_rb,
                     pdsch_end_rb, pdsch_max_pdschs_per_slot, pdsch_max_alloc_attempts,
                     pdsch_olla_cqi_inc_step, pdsch_olla_target_bler, pdsch_olla_max_cqi_offset,
                     pdsch_dc_offset, pdsch_harq_la_cqi_drop_threshold, pdsch_harq_la_ri_drop_threshold,
                     pdsch_dmrs_additional_position, pdsch_interleaving_bundle_size, pdsch_max_rank,
                     pdsch_enable_csi_rs_pdsch_multiplexing]

      - name: pusch
        description: PUSCH parameters
        parameters: [pusch_min_ue_mcs, pusch_max_ue_mcs, pusch_harq_mode_b, pusch_nof_harqs,
                     pusch_max_nof_harq_retxs, pusch_harq_retx_timeout, pusch_max_consecutive_kos,
                     pusch_rv_sequence, pusch_mcs_table, pusch_max_rank, pusch_msg3_delta_preamble,
                     pusch_p0_nominal_with_grant, pusch_msg3_delta_power, pusch_max_puschs_per_slot,
                     pusch_beta_offset_ack_idx_1, pusch_beta_offset_ack_idx_2, pusch_beta_offset_ack_idx_3,
                     pusch_beta_offset_csi_p1_idx_1, pusch_beta_offset_csi_p1_idx_2,
                     pusch_beta_offset_csi_p2_idx_1, pusch_beta_offset_csi_p2_idx_2,
                     pusch_min_k2, pusch_dc_offset, pusch_olla_snr_inc_step, pusch_olla_target_bler,
                     pusch_olla_max_snr_offset, pusch_dmrs_additional_position, pusch_min_rb_size,
                     pusch_max_rb_size, pusch_start_rb, pusch_end_rb, pusch_enable_cl_loop_pw_control,
                     pusch_enable_phr_bw_adaptation, pusch_target_sinr, pusch_ref_path_loss,
                     pusch_pl_compensation_factor, pusch_enable_transform_precoding]

      - name: pucch
        description: PUCCH parameters
        parameters: [pucch_p0_nominal, pucch_resource_common, pucch_sr_period_ms, pucch_formats,
                     pucch_resource_set_size, pucch_nof_cell_res_set_configs, pucch_nof_cell_sr_res,
                     pucch_nof_cell_csi_res, pucch_f0_intraslot_freq_hop, pucch_f1_enable_occ,
                     pucch_f1_nof_cyclic_shifts, pucch_f1_intraslot_freq_hop, pucch_f2_max_nof_rbs,
                     pucch_f2_max_payload, pucch_f2_max_code_rate, pucch_f2_intraslot_freq_hop,
                     pucch_f3_max_nof_rbs, pucch_f3_max_payload, pucch_f3_max_code_rate,
                     pucch_f3_intraslot_freq_hop, pucch_f3_additional_dmrs, pucch_f3_pi2_bpsk,
                     pucch_f4_max_code_rate, pucch_f4_intraslot_freq_hop, pucch_f4_additional_dmrs,
                     pucch_f4_pi2_bpsk, pucch_f4_occ_length, pucch_f4_enable_occ, pucch_min_k1,
                     pucch_max_consecutive_kos, pucch_enable_cl_loop_pw_control, pucch_target_sinr_f0,
                     pucch_target_sinr_f2, pucch_target_sinr_f3]

      - name: srs
        description: SRS parameters
        parameters: [srs_type_enabled, srs_period_ms, srs_max_nof_sym_per_slot, srs_nof_sym_per_resource,
                     srs_c_srs, srs_freq_domain_shift, srs_tx_comb, srs_cyclic_shift_reuse,
                     srs_sequence_id_reuse, srs_p0]

      - name: prach
        description: PRACH parameters
        parameters: [prach_config_index, prach_root_sequence_index, prach_zero_correlation_zone,
                     prach_fixed_msg3_mcs, prach_max_msg3_harq_retx, prach_total_nof_ra_preambles,
                     prach_cfra_enabled, prach_frequency_start, prach_preamble_rx_target_pw,
                     prach_preamble_trans_max, prach_power_ramping_step_db, prach_ports,
                     prach_nof_ssb_per_ro, prach_nof_cb_preambles_per_ssb, prach_ra_resp_window,
                     prach_nof_prach_guardbands_rbs, prach_slice_based_ra_prioritization]
        subcommands:
          - name: two_step
            description: Two-step RACH (MsgA/MsgB) configuration
            configurable: true
            parameters: [two_step_cb_preambles_per_ssb_per_shared_ro, two_step_msgA_rsrp_thres_dbm,
                         two_step_msgB_response_window_slots, two_step_td_offset, two_step_pusch_td_res_index,
                         two_step_mcs, two_step_nof_prbs_per_msgA_po, two_step_prb_start, two_step_po_fdm]

      - name: tdd_ul_dl_cfg
        description: TDD UL DL configuration parameters
        configurable: true
        parameters: [tdd_dl_ul_period_slots, tdd_nof_dl_slots, tdd_nof_dl_symbols,
                     tdd_nof_ul_slots, tdd_nof_ul_symbols]
        subcommands:
          - name: pattern2
            description: TDD UL DL pattern2 configuration parameters
            configurable: true
            parameters: [tdd_p2_dl_ul_period_slots, tdd_p2_nof_dl_slots, tdd_p2_nof_dl_symbols,
                         tdd_p2_nof_ul_slots, tdd_p2_nof_ul_symbols]

      - name: paging
        description: Paging parameters
        parameters: [paging_pg_search_space_id, paging_default_pg_cycle_in_rf,
                     paging_nof_pf_per_paging_cycle, paging_pf_offset, paging_nof_po_per_pf,
                     paging_edrx_enabled]

      - name: csi
        description: CSI-Meas parameters
        parameters: [csi_csi_rs_enabled, csi_csi_rs_period, csi_report_type,
                     csi_meas_csi_rs_slot_offset, csi_tracking_csi_rs_slot_offset,
                     csi_zp_csi_rs_slot_offset, csi_pwr_ctrl_offset]

      - name: scheduler
        description: Scheduler parameters
        parameters: [sched_nof_preselected_newtx_ues]
        subcommands:
          - name: policy
            description: "Scheduler policy configuration. By default, time-domain QoS-aware policy is used"
            configurable: true
            subcommands:
              - name: qos_sched
                description: Time-domain QoS-aware policy configuration
                configurable: true
                parameters: [sched_qos_combine_function, sched_qos_pf_fairness_coeff,
                             sched_qos_prio_enabled, sched_qos_pdb_enabled, sched_qos_gbr_enabled]
              - name: rr_sched
                description: Time-domain Round-robin policy configuration
                configurable: true

      - name: ta
        description: Time Advance (TA) parameters
        configurable: true
        parameters: [ta_measurement_slot_period, ta_measurement_slot_prohibit_period,
                     ta_cmd_offset_threshold, ta_target, ta_update_measurement_ul_sinr_threshold,
                     ta_outlier_detection_zscore_threshold]

      - name: drx
        description: DRX parameters
        parameters: [drx_on_duration_timer, drx_inactivity_timer, drx_retx_timer_dl,
                     drx_retx_timer_ul, drx_long_cycle]

      - name: rlm
        description: Radio Link Monitoring parameters
        parameters: [rlm_resource_type]

cli11:
  function: configure_cli11_with_du_high_config_schema
  post_configure_raw: |
    app_helpers::configure_cli11_with_metrics_appconfig_schema(app, config.config.metrics.common_metrics_cfg);

