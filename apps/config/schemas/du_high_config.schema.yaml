schema_version: 1

name: du_high_parsed_config
namespace: ocudu
description: du high configuration
generate_header: false
generate_cli11_source: false

outputs:
  header:       apps/units/flexible_o_du/o_du_high/du_high/du_high_config.h
  cli11_source: apps/units/flexible_o_du/o_du_high/du_high/du_high_config_cli11_schema.cpp
  cli11_header: apps/units/flexible_o_du/o_du_high/du_high/du_high_config_cli11_schema.h

cli11_extra_includes:
  - '"apps/helpers/logger/logger_appconfig_cli11_utils.h"'
  - '"apps/helpers/metrics/metrics_config_cli11_schema.h"'
  - '"ntn/du_high_ntn_config_cli11_schema.h"'
  - '"ocudu/adt/ranges/transform.h"'
  - '"ocudu/ran/csi_report/csi_report_configuration.h"'
  - '"ocudu/ran/drx_config.h"'
  - '"ocudu/ran/du_types.h"'
  - '"ocudu/ran/duplex_mode.h"'
  - '"ocudu/ran/pucch/pucch_mapping.h"'
  - '"ocudu/ran/slot_point_extended.h"'
  - '"ocudu/scheduler/config/scheduler_expert_config.h"'
  - '"ocudu/support/config_parsers.h"'
  - '"ocudu/support/format/fmt_to_c_str.h"'
  - '<CLI/CLI11.hpp>'
  - '<charconv>'
  - '<cmath>'

# ---------------------------------------------------------------------------
# Top-level flat parameters
# ---------------------------------------------------------------------------
parameters:
  - name: gnb_id
    description: gNodeB identifier
    type: unsigned
    cli11:
      member: config.gnb_id.id
      capture: true

  - name: gnb_id_bit_length
    description: gNodeB identifier length in bits
    type: unsigned
    mode: struct-only
    cli11:
      raw_cpp: |
        add_option(app, "--gnb_id_bit_length", config.config.gnb_id.bit_length, "gNodeB identifier length in bits")
            ->default_function([&value = config.config.gnb_id.bit_length]() { return std::to_string(value); })
            ->capture_default_str()
            ->check(CLI::Range(22, 32));

  - name: gnb_du_id
    description: gNB-DU identifier
    type: unsigned
    mode: struct-only
    cli11:
      raw_cpp: |
        add_option(app, "--gnb_du_id", config.config.gnb_du_id, "gNB-DU Id")
            ->capture_default_str()
            ->check(CLI::Range(static_cast<uint64_t>(0U), static_cast<uint64_t>((uint64_t(1) << 36) - 1)));

# ---------------------------------------------------------------------------
# Log subcommand parameters (log levels use add_log_option helper)
# ---------------------------------------------------------------------------
  - name: mac_level
    description: MAC log level
    type: struct-only
    cli11:
      raw_cpp: |
        app_helpers::add_log_option(app, config.config.loggers.mac_level, "--mac_level", "MAC log level");

  - name: rlc_level
    description: RLC log level
    type: struct-only
    cli11:
      raw_cpp: |
        app_helpers::add_log_option(app, config.config.loggers.rlc_level, "--rlc_level", "RLC log level");

  - name: f1ap_level
    description: F1AP log level
    type: struct-only
    cli11:
      raw_cpp: |
        app_helpers::add_log_option(app, config.config.loggers.f1ap_level, "--f1ap_level", "F1AP log level");

  - name: f1u_level
    description: F1-U log level
    type: struct-only
    cli11:
      raw_cpp: |
        app_helpers::add_log_option(app, config.config.loggers.f1u_level, "--f1u_level", "F1-U log level");

  - name: gtpu_level
    description: GTPU log level
    type: struct-only
    cli11:
      raw_cpp: |
        app_helpers::add_log_option(app, config.config.loggers.gtpu_level, "--gtpu_level", "GTPU log level");

  - name: ntn_level
    description: NTN log level
    type: struct-only
    cli11:
      raw_cpp: |
        app_helpers::add_log_option(app, config.config.loggers.ntn_level, "--ntn_level", "NTN log level");

  - name: du_level
    description: Log level for the DU
    type: struct-only
    cli11:
      raw_cpp: |
        app_helpers::add_log_option(app, config.config.loggers.du_level, "--du_level", "Log level for the DU");

  - name: hex_max_size
    description: Maximum number of bytes to print in hex (zero for no hex dumps, -1 for unlimited bytes)
    type: int
    range: {min: -1, max: 1024}
    cli11:
      capture: true

  - name: broadcast_enabled
    description: Enable logging in the physical and MAC layer of broadcast messages and all PRACH opportunities
    type: bool
    cli11:
      always_capture: true

  - name: f1ap_json_enabled
    description: Enable JSON logging of F1AP PDUs
    type: bool
    cli11:
      always_capture: true

  - name: high_latency_diagnostics_enabled
    description: Log performance diagnostics when high computational latencies are detected
    type: bool
    cli11:
      always_capture: true

# ---------------------------------------------------------------------------
# Trace subcommand parameters
# ---------------------------------------------------------------------------
  - name: executor_tracing_enable
    description: Enable tracing for DU-high executors
    type: bool
    cli11:
      flag: --du_high_enable
      capture: true

# ---------------------------------------------------------------------------
# Metrics subcommand parameters
# ---------------------------------------------------------------------------
  - name: du_report_period
    description: DU statistics report period in milliseconds
    type: unsigned
    mode: struct-only
    cli11:
      raw_cpp: |
        add_option(app,
                   "--du_report_period",
                   config.config.metrics.du_report_period,
                   "DU statistics report period in milliseconds")
            ->capture_default_str()
            ->check(CLI::Range(0U, static_cast<unsigned>(NOF_SUBFRAMES_PER_FRAME * NOF_SFNS * NOF_HYPER_SFNS)));

  - name: enable_scheduler
    description: Enable DU scheduler metrics
    type: bool
    cli11:
      flag: --enable_sched
      capture: true

  - name: enable_rlc
    description: Enable RLC metrics
    type: bool
    cli11:
      capture: true

  - name: enable_mac
    description: Enable MAC metrics
    type: bool
    cli11:
      capture: true

  - name: enable_du_proc
    description: Enable DU management and control procedure metrics
    type: bool
    cli11:
      capture: true

# ---------------------------------------------------------------------------
# PCAP subcommand parameters (access anonymous sub-structs via cli11.member)
# ---------------------------------------------------------------------------
  - name: f1ap_filename
    description: F1AP PCAP file output path
    type: string
    cli11:
      member: f1ap.filename
      capture: true

  - name: f1ap_enable
    description: Enable F1AP packet capture
    type: bool
    cli11:
      member: f1ap.enabled
      always_capture: true

  - name: f1u_filename
    description: F1-U PCAP file output path
    type: string
    cli11:
      member: f1u.filename
      capture: true

  - name: f1u_enable
    description: Enable F1-U packet capture
    type: bool
    cli11:
      member: f1u.enabled
      always_capture: true

  - name: rlc_filename
    description: RLC PCAP file output path
    type: string
    cli11:
      member: rlc.filename
      capture: true

  - name: rlc_rb_type
    description: RLC PCAP RB type (all, srb, drb)
    type: string
    cli11:
      member: rlc.rb_type
      capture: true

  - name: rlc_enable
    description: Enable RLC packet capture
    type: bool
    cli11:
      member: rlc.enabled
      always_capture: true

  - name: mac_filename
    description: MAC PCAP file output path
    type: string
    cli11:
      member: mac.filename
      capture: true

  - name: mac_type
    description: MAC PCAP pcap type (dlt or udp)
    type: string
    cli11:
      member: mac.type
      capture: true

  - name: mac_enable
    description: Enable MAC packet capture
    type: bool
    cli11:
      member: mac.enabled
      always_capture: true

# ---------------------------------------------------------------------------
# DU subcommand parameters
# ---------------------------------------------------------------------------
  - name: warn_on_drop
    description: Log a warning for dropped packets in F1-U, RLC and MAC due to full queues
    type: bool
    cli11:
      member: config.warn_on_drop
      capture: true

# ---------------------------------------------------------------------------
# Expert execution subcommand parameters
# ---------------------------------------------------------------------------
  - name: ue_data_executor_queue_size
    description: DU's UE executor task queue size for PDU processing
    type: unsigned
    cli11:
      flag: --du_ue_data_executor_queue_size
      capture: true

# ---------------------------------------------------------------------------
# Test mode subcommand parameters
# ---------------------------------------------------------------------------
  - name: rnti
    description: C-RNTI (0x0 if not configured)
    type: struct-only
    cli11:
      raw_cpp: |
        add_option(app, "--rnti", config.config.test_mode_cfg.test_ue.rnti, "C-RNTI (0x0 if not configured)")
            ->capture_default_str()
            ->check(CLI::Range(to_value((rnti_t::INVALID_RNTI)), to_value(rnti_t::MAX_CRNTI)));

  - name: nof_ues
    description: Number of test UE(s) to create
    type: struct-only
    cli11:
      raw_cpp: |
        add_option(app, "--nof_ues", config.config.test_mode_cfg.test_ue.nof_ues, "Number of test UE(s) to create.")
            ->capture_default_str()
            ->check(CLI::Range((uint16_t)1, (uint16_t)MAX_NOF_DU_UES));

  - name: ue_creation_stagger_slots
    description: Number of slots between consecutive test mode UE creations
    type: unsigned
    range: {min: 0, max: 10240}
    cli11:
      capture: true

  - name: auto_ack_indication_delay
    description: Delay before the UL and DL HARQs are automatically ACKed
    type: "optional<unsigned>"
    cli11:
      capture: true

  - name: attach_detach_duration_ms
    description: Duration in milliseconds of active traffic before UEs are released and recreated
    type: "optional<unsigned>"
    range: {min: 100, max: 10000}
    cli11:
      capture: true

  - name: attach_detach_guard_duration_ms
    description: Guard period duration in milliseconds between a release cycle and the next creation cycle
    type: unsigned
    range: {min: 100, max: 60000}
    cli11:
      capture: true

  - name: pdsch_active
    description: PDSCH enabled
    type: bool
    cli11:
      capture: true

  - name: pusch_active
    description: PUSCH enabled
    type: bool
    cli11:
      capture: true

  - name: cqi
    description: Channel Quality Information (CQI) to be forwarded to test UE
    type: unsigned
    range: {min: 1, max: 15}
    cli11:
      capture: true

  - name: ri
    description: Rank Indicator (RI) to be forwarded to test UE
    type: unsigned
    range: {min: 1, max: 4}
    cli11:
      capture: true

  - name: pmi
    description: Precoder Matrix Indicator (PMI) to be forwarded to test UE
    type: unsigned
    range: {min: 0, max: 3}
    cli11:
      capture: true

  - name: i_1_1
    description: Precoder Matrix codebook index "i_1_1" to be forwarded to test UE
    type: unsigned
    range: {min: 0, max: 7}
    cli11:
      capture: true

  - name: i_1_3
    description: Precoder Matrix codebook index "i_1_3" to be forwarded to test UE
    type: unsigned
    range: {min: 0, max: 1}
    cli11:
      capture: true

  - name: i_2
    description: Precoder Matrix codebook index "i_2" to be forwarded to test UE
    type: unsigned
    range: {min: 0, max: 3}
    cli11:
      capture: true

# ---------------------------------------------------------------------------
# cell_cfg subcommand parameters — doc-only, hand-written C++ in du_high_config_cli11_schema.cpp
# ---------------------------------------------------------------------------

  # --- Direct cell_cfg options ---
  - name: cell_pci
    description: PCI
    type: int
    mode: doc-only
    range: {min: 0, max: 1007}
    cli11:
      flag: --pci

  - name: cell_sector_id
    description: "Sector ID (4-14 bits). Concatenated with gNB Id to form the NR Cell Identity (NCI). Auto-derived if not specified"
    type: unsigned
    mode: doc-only
    range: {min: 0, max: 16383}
    cli11:
      flag: --sector_id

  - name: cell_dl_arfcn
    description: Downlink ARFCN
    type: unsigned
    mode: doc-only
    cli11:
      flag: --dl_arfcn

  - name: cell_band
    description: NR band
    type: string
    mode: doc-only
    cli11:
      flag: --band

  - name: cell_common_scs
    description: Cell common subcarrier spacing
    type: string
    mode: doc-only
    cli11:
      flag: --common_scs

  - name: cell_channel_bandwidth_MHz
    description: Channel bandwidth in MHz
    type: unsigned
    mode: doc-only
    cli11:
      flag: --channel_bandwidth_MHz

  - name: cell_nof_antennas_ul
    description: Number of antennas in uplink
    type: unsigned
    mode: doc-only
    cli11:
      flag: --nof_antennas_ul

  - name: cell_nof_antennas_dl
    description: Number of antennas in downlink
    type: unsigned
    mode: doc-only
    cli11:
      flag: --nof_antennas_dl

  - name: cell_plmn
    description: PLMN
    type: string
    mode: doc-only
    cli11:
      flag: --plmn

  - name: cell_additional_plmns
    description: List of PLMNs
    type: string
    mode: doc-only
    cli11:
      flag: --additional_plmns

  - name: cell_tac
    description: TAC
    type: unsigned
    mode: doc-only
    cli11:
      flag: --tac

  - name: cell_enabled
    description: Automatically activate the cell on startup
    type: bool
    mode: doc-only
    cli11:
      flag: --enabled

  - name: cell_cell_barred
    description: "MIB cellBarred: if true, UEs cannot camp on this cell"
    type: bool
    mode: doc-only
    cli11:
      flag: --cell_barred

  - name: cell_intra_freq_reselection
    description: "MIB intraFreqReselection: if true, intra-frequency cell reselection is allowed when cell is barred"
    type: bool
    mode: doc-only
    cli11:
      flag: --intra_freq_reselection

  - name: cell_q_rx_lev_min
    description: "q-RxLevMin: required minimum received RSRP level for cell selection/re-selection, in dBm"
    type: int
    mode: doc-only
    range: {min: -70, max: -22}
    cli11:
      flag: --q_rx_lev_min

  - name: cell_q_qual_min
    description: "q-QualMin: required minimum received RSRQ level for cell selection/re-selection, in dB"
    type: int
    mode: doc-only
    range: {min: -43, max: -12}
    cli11:
      flag: --q_qual_min

  - name: cell_pcg_p_nr_fr1
    description: "p-nr-fr1: maximum total TX power to be used by the UE in this NR cell group across FR1"
    type: int
    mode: doc-only
    range: {min: -30, max: 23}
    cli11:
      flag: --pcg_p_nr_fr1

  - name: cell_slicing
    description: "Network slicing configuration (list of slice configs with sst, sd, and sched_cfg)"
    type: string
    mode: doc-only
    cli11:
      flag: --slicing

  # --- MAC Cell Group: BSR ---
  - name: bsr_periodic_bsr_timer
    description: "Periodic BSR Timer in nof. subframes. Value 0 equates to infinity"
    type: unsigned
    mode: doc-only
    cli11:
      flag: --periodic_bsr_timer

  - name: bsr_retx_bsr_timer
    description: "Retransmission BSR Timer in nof. subframes"
    type: unsigned
    mode: doc-only
    cli11:
      flag: --retx_bsr_timer

  - name: bsr_lc_sr_delay_timer
    description: "Logical Channel SR delay timer in nof. subframes"
    type: unsigned
    mode: doc-only
    cli11:
      flag: --lc_sr_delay_timer

  # --- MAC Cell Group: PHR ---
  - name: phr_prohib_timer
    description: PHR prohibit timer in nof. subframes
    type: unsigned
    mode: doc-only
    cli11:
      flag: --phr_prohibit_timer

  # --- MAC Cell Group: SR ---
  - name: sr_trans_max
    description: Maximum number of SR transmissions
    type: unsigned
    mode: doc-only
    cli11:
      flag: --sr_trans_max

  - name: sr_prohibit_timer
    description: Timer for SR transmission on PUCCH in ms
    type: unsigned
    mode: doc-only
    cli11:
      flag: --sr_prohibit_timer

  # --- SSB ---
  - name: ssb_period_msec
    description: Period of SSB scheduling in milliseconds
    type: unsigned
    mode: doc-only
    cli11:
      flag: --ssb_period

  - name: ssb_block_power
    description: SS_PBCH_power_block in dBm
    type: int
    mode: doc-only
    range: {min: -60, max: 50}
    cli11:
      flag: --ssb_block_power_dbm

  - name: ssb_pss_to_sss_epre
    description: "SSB PSS to SSS EPRE ratio in dB {0, 3}"
    type: unsigned
    mode: doc-only
    cli11:
      flag: --pss_to_sss_epre_db

  # --- SIB direct ---
  - name: sib_si_window_len
    description: "Length of the SI scheduling window in slots. Must be shorter or equal to SI period"
    type: unsigned
    mode: doc-only
    cli11:
      flag: --si_window_length

  - name: sib_si_sched_info
    description: "Scheduling for each SI-message (list of {si_period, sib_mapping, si_window_position})"
    type: string
    mode: doc-only
    cli11:
      flag: --si_sched_info

  - name: sib_t300
    description: RRC Connection Establishment timer in ms
    type: unsigned
    mode: doc-only
    cli11:
      flag: --t300

  - name: sib_t301
    description: RRC Connection Re-establishment timer in ms
    type: unsigned
    mode: doc-only
    cli11:
      flag: --t301

  - name: sib_t310
    description: Out-of-sync timer in ms
    type: unsigned
    mode: doc-only
    cli11:
      flag: --t310

  - name: sib_n310
    description: Out-of-sync counter
    type: unsigned
    mode: doc-only
    cli11:
      flag: --n310

  - name: sib_t311
    description: RRC Connection Re-establishment procedure timer in ms
    type: unsigned
    mode: doc-only
    cli11:
      flag: --t311

  - name: sib_n311
    description: In-sync counter
    type: unsigned
    mode: doc-only
    cli11:
      flag: --n311

  - name: sib_t319
    description: RRC Connection Resume timer in ms
    type: unsigned
    mode: doc-only
    cli11:
      flag: --t319

  # --- SIB2 ---
  - name: sib2_q_hyst
    description: Hysteresis value for ranking criteria
    type: int
    mode: doc-only
    cli11:
      flag: --q_hyst

  - name: sib2_thresh_serving_low_p
    description: Rx level threshold for serving cell when reselecting towards a lower priority RAT/frequency
    type: unsigned
    mode: doc-only
    range: {min: 0, max: 31}
    cli11:
      flag: --thresh_serving_low_p

  - name: sib2_cell_reselection_priority
    description: Integer part of the cell reselection priority for the frequency of this cell
    type: unsigned
    mode: doc-only
    range: {min: 0, max: 7}
    cli11:
      flag: --cell_reselection_priority

  - name: sib2_q_rx_lev_min
    description: Minimum required Rx level in the cell in dBm
    type: int
    mode: doc-only
    cli11:
      flag: --q_rx_lev_min

  - name: sib2_s_intra_search_p
    description: Rx level threshold for intra frequency measurements in dB
    type: unsigned
    mode: doc-only
    cli11:
      flag: --s_intra_search_p

  - name: sib2_t_reselection_nr
    description: Cell reselection timer value in seconds
    type: unsigned
    mode: doc-only
    range: {min: 0, max: 7}
    cli11:
      flag: --t_reselection_nr

  # --- SIB3 ---
  - name: sib3_intra_freq_neigh_cell_list
    description: "Intra frequency neighbor cell list (list of {pci, q_offset_cell})"
    type: string
    mode: doc-only
    cli11:
      flag: --intra_freq_neigh_cell_list

  - name: sib3_intra_freq_excluded_cell_list
    description: "Intra frequency excluded cell list (list of {start, size})"
    type: string
    mode: doc-only
    cli11:
      flag: --intra_freq_excluded_cell_list

  # --- SIB4 ---
  - name: sib4_inter_freq_carrier_freq_list
    description: "Inter frequency carrier frequency list (list of {arfcn, ssb_scs, q_rx_lev_min, thresh_x_high_p, thresh_x_low_p, q_offset_freq})"
    type: string
    mode: doc-only
    cli11:
      flag: --inter_freq_carrier_freq_list

  # --- SIB5 ---
  - name: sib5_t_reselection_eutra
    description: Cell reselection timer value in seconds for EUTRA
    type: unsigned
    mode: doc-only
    range: {min: 0, max: 7}
    cli11:
      flag: --t_reselection_eutra

  - name: sib5_carrier_freq_list_eutra
    description: "EUTRA carrier frequency list (list of {earfcn, allowed_meas_bandwidth, cell_reselection_priority, thresh_x_high, thresh_x_low, q_rx_lev_min, q_qual_min, p_max_eutra})"
    type: string
    mode: doc-only
    cli11:
      flag: --carrier_freq_list_eutra

  # --- SIB16 ---
  - name: sib16_freq_prio_list_slicing
    description: "Frequency priority slicing list (list of {dl_implicit_carrier_freq, slice_info_list})"
    type: string
    mode: doc-only
    cli11:
      flag: --freq_prio_list_slicing

  # --- ETWS ---
  - name: etws_message_id
    description: ETWS message ID
    type: unsigned
    mode: doc-only
    cli11:
      flag: --message_id

  - name: etws_serial_num
    description: ETWS message serial number
    type: unsigned
    mode: doc-only
    cli11:
      flag: --serial_num

  - name: etws_warning_type
    description: ETWS warning type
    type: unsigned
    mode: doc-only
    cli11:
      flag: --warning_type

  - name: etws_data_coding_scheme
    description: ETWS message CBS coding scheme
    type: unsigned
    mode: doc-only
    cli11:
      flag: --data_coding_scheme

  - name: etws_warning_message
    description: ETWS warning message
    type: string
    mode: doc-only
    cli11:
      flag: --warning_message

  # --- CMAS ---
  - name: cmas_message_id
    description: CMAS message ID
    type: unsigned
    mode: doc-only
    cli11:
      flag: --message_id

  - name: cmas_serial_num
    description: CMAS message serial number
    type: unsigned
    mode: doc-only
    cli11:
      flag: --serial_num

  - name: cmas_data_coding_scheme
    description: CMAS message CBS coding scheme
    type: unsigned
    mode: doc-only
    cli11:
      flag: --data_coding_scheme

  - name: cmas_warning_message
    description: CMAS warning message
    type: string
    mode: doc-only
    cli11:
      flag: --warning_message

  # --- UL common ---
  - name: ul_p_max
    description: Maximum transmit power allowed in this serving cell
    type: int
    mode: doc-only
    range: {min: -30, max: 23}
    cli11:
      flag: --p_max

  - name: ul_max_pucchs_per_slot
    description: Maximum number of PUCCH grants that can be allocated per slot
    type: unsigned
    mode: doc-only
    cli11:
      flag: --max_pucchs_per_slot

  - name: ul_max_ul_grants_per_slot
    description: Maximum number of UL grants that can be allocated per slot
    type: unsigned
    mode: doc-only
    cli11:
      flag: --max_ul_grants_per_slot

  - name: ul_min_pucch_pusch_prb_distance
    description: Minimum PRB distance between PUCCH and UE-dedicated PUSCH grants
    type: unsigned
    mode: doc-only
    cli11:
      flag: --min_pucch_pusch_prb_distance

  # --- PDCCH common ---
  - name: pdcch_common_coreset0_index
    description: "CORESET#0 index"
    type: unsigned
    mode: doc-only
    range: {min: 0, max: 15}
    cli11:
      flag: --coreset0_index

  - name: pdcch_common_ss1_n_candidates
    description: "Number of PDCCH candidates per aggregation level for SearchSpace#1"
    type: string
    mode: doc-only
